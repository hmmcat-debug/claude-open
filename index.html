<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Claude 앱 열기</title>
<style>
  :root { --bg: #f6f6f4; --text: #1f1f1d; --muted: #6f6f67; --button: #c6613f; --button-text: #ffffff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --text: #eeeeea; --muted: #9b9b92; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 14px; padding: 16px; text-align: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  a { padding: 18px 40px; border-radius: 10px; background: var(--button); color: var(--button-text); font-size: 18px; font-weight: 600; text-decoration: none; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<a id="open" href="https://claude.ai/" hidden>Claude 앱에서 열기</a>
<p id="message"></p>
<script>
  // 주소의 # 뒷부분은 서버로 전송되지 않습니다. claude.ai의 채팅, 프로젝트, 새 채팅 주소만 허용합니다.
  const ALLOWED = /^\/(chat\/[0-9a-f-]{36}|project\/[\w-]+|new)$/;

  function target(hash) {
    try {
      const url = new URL(hash.slice(1), "https://claude.ai");
      return url.origin === "https://claude.ai" && ALLOWED.test(url.pathname) ? url.href : null;
    } catch {
      return null;
    }
  }

  const link = target(location.hash);
  if (link) {
    const open = document.getElementById("open");
    open.href = link;
    open.hidden = false;
    document.getElementById("message").textContent = "앱이 열리지 않으면 시간표로 돌아가 다시 눌러 주세요.";
  } else {
    document.getElementById("message").textContent = "열 수 있는 채팅 주소가 없어요. 시간표에서 수업을 눌러 들어와 주세요.";
  }
</script>
</body>
</html>
